[workspace]
resolver = "3"
members = ["crates/cdr-core", "crates/cdr-cli"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "UNLICENSED"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
claxon = "0.4"
flacenc = "0.5"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
metaflac = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
ureq = "2"
