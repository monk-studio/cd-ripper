# Its own workspace: `nsh` generates runner crates under .nsh/ that must not
# be taken for members of the root workspace.
[package]
name = "cdr-app"
version = "0.1.0"
edition = "2024"
publish = false
license = "UNLICENSED"

[workspace]

[dependencies]
anyhow = "1"
cdr-core = { path = "../cdr-core" }
env_logger = "0.11"
log = "0.4"
nsh-base = "0.5.1"
nsh-core = "0.5.1"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.5.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.5.1", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.5.1", default-features = false }
